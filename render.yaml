services:
  - type: web
    name: wk-health-backend
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: wk-health-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: CORS_ORIGINS
        value: https://wk-health-frontend.onrender.com,https://sites.google.com
      - key: GEMINI_VISION_MODEL
        value: gemini-2.5-flash-lite
      - key: GEMINI_VISION_PROXY_URL
        value: https://apigemini.katodoohee.workers.dev
      - key: DEEPSEEK_PROXY_URL
        value: https://kasidathdeepseek.katodoohee.workers.dev
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
