name: WK Health Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Start server
        run: |
          mkdir -p data
          nohup npm start > /tmp/wk-health-backend.log 2>&1 &
          echo $! > /tmp/wk-health-backend.pid

      - name: Wait for health endpoint
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/api/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wk-health-backend.log
          exit 1

      - name: Integration smoke
        run: node scripts/smoke.mjs

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/wk-health-backend.pid ]; then kill "$(cat /tmp/wk-health-backend.pid)" || true; fi
          cat /tmp/wk-health-backend.log || true
